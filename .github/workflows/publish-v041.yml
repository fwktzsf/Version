name: Publish V0.4.1 update package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v041.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download V0.4.1 installer artifact
        shell: pwsh
        run: |
          $url = 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-b7e8-81fd-b247-02f21e8fbbc6/raw?se=2026-09-11T00%3A55%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=9adf4c42-972f-5a83-84ea-63a9cc768cf1&skoid=4b04981f-b1dc-41e0-a770-8ce0d5c8f411&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-10T02%3A43%3A41Z&ske=2026-09-11T02%3A43%3A41Z&sks=b&skv=2026-02-06&sig=COmkFhbACGoIoZLYo4wmIpiOkhWdh9oARIHSHFgrt44%3D'
          Invoke-WebRequest -Uri $url -OutFile artifact-v041.zip
          Expand-Archive artifact-v041.zip -DestinationPath unpack-v041 -Force
          $exe = Get-ChildItem unpack-v041 -Recurse -Filter 'ViralStockPoster-Setup-V0.4.1.exe' | Select-Object -First 1
          if (-not $exe) { throw 'V0.4.1 installer not found in artifact' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '121f4507fabf26c535724701c9a60bb2f7fb755b71faf9736d3f944959e1e8af') { throw "SHA256 mismatch: $hash" }
          New-Item -ItemType Directory -Force -Path 'releases/v0.4.1' | Out-Null
          Copy-Item $exe.FullName 'releases/v0.4.1/ViralStockPoster-Setup-V0.4.1.exe' -Force
          $size = (Get-Item 'releases/v0.4.1/ViralStockPoster-Setup-V0.4.1.exe').Length
          $manifest = [ordered]@{
            version = '0.4.1'
            notes = '后台自动更新：发现新版本后自动下载、校验、静默升级并重新启动；关闭窗口可选择最小化到系统托盘、退出或取消；参考图预览增加坏图回退、截断容错和锐化。'
            sha256 = '121f4507fabf26c535724701c9a60bb2f7fb755b71faf9736d3f944959e1e8af'
            size = $size
            url = 'https://raw.githubusercontent.com/fwktzsf/Version/main/releases/v0.4.1/ViralStockPoster-Setup-V0.4.1.exe'
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding UTF8 latest.json

      - name: Commit public update feed
        shell: pwsh
        run: |
          git config user.name 'ViralStockPoster Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add latest.json releases/v0.4.1/ViralStockPoster-Setup-V0.4.1.exe
          git commit -m 'Publish V0.4.1 automatic update' || echo 'Nothing to commit'
          git push
